<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia Financeiro Digital - Simuladores</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-blue-900 text-white p-4 text-center shadow-md">
    <h1 class="text-xl font-bold">Guia Financeiro Digital</h1>
    <p class="text-xs text-blue-200">Suíte de Simuladores Rápidos</p>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 p-4 max-w-md mx-auto w-full">
    <h2 class="text-lg font-semibold mb-4 text-gray-700">Escolha uma ferramenta:</h2>
    
    <div class="grid grid-cols-1 gap-3">
      <button class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-left hover:bg-blue-50">
        <p class="font-bold text-blue-900">💼 Calculadora CLT vs PJ</p>
        <p class="text-xs text-gray-500">Compare renda líquida real e benefícios</p>
      </button>

      <button class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-left hover:bg-blue-50">
        <p class="font-bold text-blue-900">🏠 Simulador de Financiamento</p>
        <p class="text-xs text-gray-500">Tabela SAC vs PRICE e amortização</p>
      </button>

      <button class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-left hover:bg-blue-50">
        <p class="font-bold text-blue-900">📈 Juros Compostos</p>
        <p class="text-xs text-gray-500">Simule sua independência financeira</p>
      </button>

      <button class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-left hover:bg-blue-50">
        <p class="font-bold text-blue-900">⛽ Comparador de Combustível</p>
        <p class="text-xs text-gray-500">Álcool vs Gasolina + consumo/km</p>
      </button>
    </div>
  </main>

  <!-- Banner AdMob Simulado -->
  <footer class="bg-gray-300 text-gray-600 text-xs text-center p-3 border-t border-gray-400">
    [ Espaço do Anúncio AdMob ]
  </footer>

</body>
</html>
