<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia Financeiro Digital - Simuladores</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-blue-900 text-white p-4 text-center shadow-md">
    <h1 class="text-xl font-bold">Guia Financeiro Digital</h1>
    <p class="text-xs text-blue-200">Suíte de Simuladores Rápidos</p>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 p-4 max-w-md mx-auto w-full">
    
    <!-- Tela do Simulador CLT vs PJ -->
    <div class="bg-white p-5 rounded-xl shadow-md border border-gray-200">
      <h2 class="text-lg font-bold text-blue-900 mb-1">💼 CLT vs PJ</h2>
      <p class="text-xs text-gray-500 mb-4">Compare a renda líquida aproximada de cada opção.</p>

      <div class="space-y-3 text-sm">
        <div>
          <label class="block font-medium text-gray-700 mb-1">Salário Bruto CLT (R$)</label>
          <input type="number" id="cltSalario" placeholder="Ex: 5000" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label class="block font-medium text-gray-700 mb-1">Benefícios CLT / Mês (R$)</label>
          <span class="text-xs text-gray-400 block mb-1">VR, VA, VT, Plano de Saúde, etc.</span>
          <input type="number" id="cltBeneficios" placeholder="Ex: 1000" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label class="block font-medium text-gray-700 mb-1">Faturamento PJ Mensal (R$)</label>
          <input type="number" id="pjFaturamento" placeholder="Ex: 8000" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <button onclick="calcularSimulacao()" class="w-full bg-blue-900 text-white font-bold py-2.5 rounded-lg hover:bg-blue-800 transition">
          Calcular Comparativo
        </button>
      </div>

      <!-- Área de Resultados -->
      <div id="resultado" class="hidden mt-5 p-4 rounded-lg border text-sm space-y-2">
        <h3 class="font-bold text-gray-800 border-b pb-1">Resultado Estimado:</h3>
        
        <div class="flex justify-between">
          <span>Líquido Real CLT (+ Benefícios):</span>
          <span id="resClt" class="font-semibold text-gray-800">R$ 0,00</span>
        </div>

        <div class="flex justify-between">
          <span>Líquido Real PJ (Simples - ~6%):</span>
          <span id="resPj" class="font-semibold text-gray-800">R$ 0,00</span>
        </div>

        <div id="veredicto" class="mt-3 p-2 text-center rounded font-bold text-xs"></div>
      </div>
    </div>

  </main>

  <!-- Banner AdMob Simulado -->
  <footer class="bg-gray-300 text-gray-600 text-xs text-center p-3 border-t border-gray-400">
    [ Espaço do Anúncio AdMob ]
  </footer>

  <script>
    function calcularSimulacao() {
      const clt = parseFloat(document.getElementById('cltSalario').value) || 0;
      const beneficios = parseFloat(document.getElementById('cltBeneficios').value) || 0;
      const pj = parseFloat(document.getElementById('pjFaturamento').value) || 0;

      if(clt <= 0 && pj <= 0) {
        alert("Por favor, preencha pelo menos um valor de salário ou faturamento.");
        return;
      }

      // Estimativa média de desconto CLT (INSS + IRRF ~ 15%)
      const cltLiquido = (clt * 0.85) + beneficios;

      // Estimativa imposto Simples Nacional PJ (~ 6%)
      const pjLiquido = pj * 0.94;

      document.getElementById('resClt').innerText = 'R$ ' + cltLiquido.toFixed(2);
      document.getElementById('resPj').innerText = 'R$ ' + pjLiquido.toFixed(2);

      const veredictoEl = document.getElementById('veredicto');
      if (pjLiquido > cltLiquido) {
        veredictoEl.className = "mt-3 p-2 text-center rounded font-bold text-xs bg-green-100 text-green-800";
        veredictoEl.innerText = "A opção PJ traz maior ganho financeiro mensal!";
      } else {
        veredictoEl.className = "mt-3 p-2 text-center rounded font-bold text-xs bg-blue-100 text-blue-800";
        veredictoEl.innerText = "A opção CLT (+ Benefícios) está mais vantajosa!";
      }

      document.getElementById('resultado').classList.remove('hidden');
    }
  </script>
</body>
</html>
